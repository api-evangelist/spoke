description: 'SPOKE (spoke-london.com) is a London-based direct-to-consumer men''s fashion
  retailer specializing in tailored menswear engineered for precise fit, with the tagline
  "A flawless fit, delivered." Its range spans trousers, denim, shirts, knitwear, shorts,
  tailoring (suits and jackets) and accessories, sold through an e-commerce storefront with
  a "Fit Finder" sizing tool. Backed by Seedcamp and tracked in the API Evangelist network
  as a portfolio company. An enrichment pass found no public developer program, API, or
  developer documentation; the company operates a standard retail e-commerce storefront only.'
